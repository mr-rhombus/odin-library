<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Odin Library</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="bookshelf">
      <div class="book">
        <div class="book-data">
          <div class="title">Book Title</div>
          <div class="author">Author</div>
          <div class="page-ct">100 pages</div>
        </div>
        <div class="actions">
          <button class="delete">
            <img src="assets/glasses-outline.svg" alt="" />
          </button>
          <button class="unread">
            <img src="assets/delete-icon.svg" alt="" />
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
